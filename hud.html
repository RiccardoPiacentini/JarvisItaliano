<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<style>
  :root { --c: #00e5ff; --g: #7dffb0; --a: #ffd166; --r: #ff6b6b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    color: var(--c); font-family: Consolas, "Courier New", monospace;
    background: radial-gradient(ellipse at center, #06202e 0%, #02070d 70%);
  }
  body.idle, body.idle * { cursor: none !important; }
  button { font-family: inherit; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #scan { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(0deg, rgba(0,229,255,.03) 0 1px, transparent 1px 3px); }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
  .corner { position: fixed; width: 46px; height: 46px; border: 2px solid rgba(0,229,255,.6);
    pointer-events: none; z-index: 2; filter: drop-shadow(0 0 6px var(--c)); }
  .corner.tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }

  .panel { position: fixed; opacity: 0; transition: opacity 1.5s; z-index: 3;
    font-size: 13px; letter-spacing: 2px; text-shadow: 0 0 8px var(--c); }
  .on { opacity: 1; }
  .h { opacity: .7; margin-bottom: 10px; border-bottom: 1px solid rgba(0,229,255,.3); padding-bottom: 6px;
    display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
  .h .hs { opacity: .55; font-size: 10px; }
  .empty { opacity: .65; font-size: 12px; line-height: 1.7; letter-spacing: 1px; padding: 6px 2px; }

  #title { top: 28px; left: 0; right: 0; text-align: center; pointer-events: none; }
  #title h1 { font-size: 34px; letter-spacing: 16px; font-weight: 400; }
  #title p { margin-top: 6px; font-size: 11px; letter-spacing: 5px; opacity: .6; }
  #clock { top: 28px; right: 40px; text-align: right; pointer-events: none; }
  #clock .t { font-size: 34px; letter-spacing: 4px; }
  #clock .d { font-size: 12px; opacity: .7; margin-top: 4px; }

  /* ---- colonna sinistra: avvio -> pulsanti, stato ---- */
  #left { left: 40px; top: 15vh; bottom: 7vh; width: 330px; display: flex; flex-direction: column; gap: 22px; }
  #log { line-height: 1.9; transition: opacity .6s; }
  #log div.l { opacity: 0; animation: fi .4s forwards; }
  #log .ok { float: right; color: var(--g); text-shadow: 0 0 8px var(--g); }
  @keyframes fi { to { opacity: .9; } }
  #dock { display: none; }
  #dock.show { display: block; animation: dockin .8s both; }
  @keyframes dockin { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  .btn { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; height: 54px;
    padding: 0 14px; margin-bottom: 9px; cursor: pointer; color: var(--c); text-align: left;
    background: rgba(0,229,255,.04); border: 1px solid rgba(0,229,255,.25); letter-spacing: 2px;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: background .25s, border-color .25s, color .25s, transform .25s; }
  .btn:hover { background: rgba(0,229,255,.15); border-color: var(--c); transform: translateX(4px); }
  .btn.active { background: rgba(0,229,255,.22); border-color: #aef6ff; color: #fff; }
  .btn.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--c); box-shadow: 0 0 12px var(--c); }
  .btn .ic { flex: none; width: 28px; height: 28px; filter: drop-shadow(0 0 5px var(--c)); }
  .btn .t { flex: 1; min-width: 0; }
  .btn .n { font-size: 13px; letter-spacing: 3px; }
  .btn .hh { font-size: 10px; opacity: .55; letter-spacing: 1px; margin-top: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .btn .k { font-size: 10px; opacity: .45; margin-right: 6px; }
  .badge { display: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; margin-right: 6px;
    background: var(--a); color: #02070d; font-size: 11px; font-weight: bold; align-items: center;
    justify-content: center; box-shadow: 0 0 10px var(--a); animation: pulse 2s infinite; }
  .badge.on2 { display: flex; }
  @keyframes pulse { 50% { box-shadow: 0 0 18px var(--a); } }
  #stats { margin-top: auto; }
  .row { margin-bottom: 12px; }
  .row .n { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
  .bar { height: 5px; background: rgba(0,229,255,.12); }
  .bar i { display: block; height: 100%; background: var(--c); box-shadow: 0 0 10px var(--c); width: 50%; transition: width .6s; }

  /* ---- attivita' recente (destra) ---- */
  #feed { right: 40px; top: 19vh; width: 330px; transition: opacity .5s; }
  #feed.hide { opacity: 0 !important; pointer-events: none; }
  .f { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dashed rgba(0,229,255,.18); font-size: 12px;
    letter-spacing: 1px; line-height: 1.4; animation: rowin .5s both; }
  .f .tm { flex: none; opacity: .5; }
  .f.err { color: var(--r); text-shadow: none; }

  /* ---- finestra laterale ---- */
  #win { position: fixed; right: 40px; top: 13vh; width: min(560px, 40vw); max-height: 62vh; z-index: 6;
    display: flex; flex-direction: column; letter-spacing: 1px;
    background: linear-gradient(180deg, rgba(4,24,37,.93), rgba(3,13,22,.95));
    border: 1px solid rgba(0,229,255,.5); backdrop-filter: blur(4px);
    box-shadow: 0 0 50px rgba(0,229,255,.2), inset 0 0 40px rgba(0,229,255,.05);
    transform: translateX(calc(100% + 80px)); opacity: 0; pointer-events: none;
    transition: transform .75s cubic-bezier(.16,.84,.24,1), opacity .5s, width .5s; }
  #win.open { transform: none; opacity: 1; pointer-events: auto; }
  #win.wide { width: min(780px, 52vw); }
  #win .cn { position: absolute; width: 14px; height: 14px; border: 2px solid #aef6ff; }
  #win .cn.a { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
  #win .cn.b { top: -3px; right: -3px; border-left: 0; border-bottom: 0; }
  #win .cn.c { bottom: -3px; left: -3px; border-right: 0; border-top: 0; }
  #win .cn.d { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }
  .wh { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-size: 12px; letter-spacing: 3px;
    border-bottom: 1px solid rgba(0,229,255,.25); }
  #wt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { padding: 3px 10px; font-size: 10px; letter-spacing: 3px; border: 1px solid currentColor; }
  .chip.amber { color: var(--a); } .chip.cyan { color: var(--c); } .chip.green { color: var(--g); } .chip.red { color: var(--r); }
  #wx { width: 26px; height: 26px; cursor: pointer; color: var(--c); background: none;
    border: 1px solid rgba(0,229,255,.4); }
  #wx:hover { background: rgba(0,229,255,.2); }
  #wbar { flex: none; height: 2px; background: rgba(0,229,255,.1); position: relative; overflow: hidden; }
  #wbar.run::after { content: ''; position: absolute; top: 0; bottom: 0; left: -30%; width: 30%;
    background: linear-gradient(90deg, transparent, var(--c), transparent); animation: sweep 1.1s linear infinite; }
  @keyframes sweep { to { left: 100%; } }
  #wb { flex: 1; overflow-y: auto; padding: 16px; min-height: 140px; }
  #wb::-webkit-scrollbar { width: 5px; } #wb::-webkit-scrollbar-thumb { background: rgba(0,229,255,.4); }
  #win.isdoc #wb { padding: 0; }
  #wf { display: none; flex: none; align-items: center; gap: 10px; padding: 10px 16px; font-size: 11px;
    letter-spacing: 2px; border-top: 1px solid rgba(0,229,255,.25); }
  #wf .fn { flex: 1; min-width: 0; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fb { padding: 6px 14px; cursor: pointer; letter-spacing: 2px; font-size: 11px; color: var(--c);
    background: transparent; border: 1px solid var(--c); }
  .fb:hover:not(:disabled) { background: rgba(0,229,255,.2); }
  .fb:disabled { opacity: .3; cursor: default; }

  .sub { font-size: 11px; letter-spacing: 3px; opacity: .65; margin-bottom: 12px; }
  .scanmsg { font-size: 11px; letter-spacing: 3px; opacity: .8; margin: 6px 0 14px; animation: blinkt 1.2s infinite; }
  @keyframes blinkt { 50% { opacity: .35; } }
  .sk { height: 46px; margin-bottom: 8px; background: linear-gradient(90deg, rgba(0,229,255,.05), rgba(0,229,255,.18), rgba(0,229,255,.05));
    background-size: 200% 100%; animation: shim 1.2s linear infinite; }
  @keyframes shim { to { background-position: -200% 0; } }
  .errbox { color: var(--r); border: 1px solid rgba(255,107,107,.5); background: rgba(255,107,107,.08);
    padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  @keyframes rowin { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }

  .day { font-size: 11px; letter-spacing: 3px; opacity: .65; margin: 14px 0 8px; text-transform: uppercase;
    border-bottom: 1px solid rgba(0,229,255,.15); padding-bottom: 5px; }
  .ev { display: flex; gap: 14px; padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid var(--c);
    background: rgba(0,229,255,.06); animation: rowin .5s both; }
  .ev .tm { flex: none; width: 108px; font-size: 13px; color: #bff6ff; }
  .ev .ti { font-size: 15px; color: #fff; letter-spacing: .5px; }
  .ev .pl { font-size: 12px; opacity: .6; margin-top: 3px; }

  .wnow { display: flex; align-items: center; gap: 24px; padding: 4px 4px 20px; }
  .wnow svg { flex: none; filter: drop-shadow(0 0 10px var(--c)); }
  .wnow .big { font-size: 56px; line-height: 1; color: #fff; text-shadow: 0 0 14px var(--c); }
  .wnow .dsc { font-size: 15px; letter-spacing: 3px; margin-top: 6px; text-transform: uppercase; }
  .wnow .s2 { font-size: 11px; opacity: .65; margin-top: 8px; letter-spacing: 1px; line-height: 1.5; }
  .wdays { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .wd { text-align: center; padding: 12px 4px; border: 1px solid rgba(0,229,255,.2); background: rgba(0,229,255,.05);
    animation: rowin .5s both; }
  .wd .wn { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; opacity: .8; }
  .wd .wtp { margin-top: 8px; font-size: 13px; } .wd .wtp b { color: #fff; font-size: 16px; }
  .wd .wr { font-size: 10px; opacity: .6; margin-top: 4px; }

  .r { display: block; padding: 10px 12px; margin-bottom: 9px; color: inherit; text-decoration: none;
    border: 1px solid rgba(0,229,255,.18); background: rgba(0,229,255,.04); animation: rowin .5s both; }
  .r:hover { border-color: var(--c); background: rgba(0,229,255,.1); }
  .r .rt { font-size: 14.5px; color: #e8fdff; letter-spacing: .3px; line-height: 1.35; }
  .r .rs { font-size: 10.5px; opacity: .55; letter-spacing: 1.5px; margin: 4px 0; }
  .r .rb { font-size: 12.5px; opacity: .8; line-height: 1.5; letter-spacing: .2px; }
  .pg { font-size: 13.5px; line-height: 1.65; color: #cdf8ff; letter-spacing: .2px; white-space: pre-wrap; }
  .radar { position: relative; height: 70px; margin-bottom: 8px; border: 1px solid rgba(0,229,255,.2); overflow: hidden;
    background: repeating-linear-gradient(90deg, rgba(0,229,255,.08) 0 1px, transparent 1px 28px); }
  .radar i { position: absolute; top: 0; bottom: 0; width: 60px; left: -60px;
    background: linear-gradient(90deg, transparent, rgba(0,229,255,.55)); animation: rad 1.4s linear infinite; }
  @keyframes rad { to { left: 100%; } }

  .m { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 10px 12px; margin-bottom: 8px;
    border: 1px solid rgba(0,229,255,.18); background: rgba(0,229,255,.04); animation: rowin .5s both;
    transition: background .2s, border-color .2s; }
  .m:hover { background: rgba(0,229,255,.14); border-color: var(--c); }
  .m .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .m.read { opacity: .5; }
  .m.read .dot { background: transparent; box-shadow: none; border: 1px solid rgba(0,229,255,.5); }
  .m .tx { flex: 1; min-width: 0; }
  .m .f1, .m .s1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m .f1 { font-size: 13px; } .m .s1 { font-size: 13px; opacity: .78; letter-spacing: 0; margin-top: 2px; }
  .m .b1 { font-size: 10px; opacity: .55; margin-top: 5px; letter-spacing: 2px; }

  .fl { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
    border: 1px solid rgba(0,229,255,.18); background: rgba(0,229,255,.04); animation: rowin .5s both; }
  .fl:hover { border-color: var(--c); background: rgba(0,229,255,.12); }
  .fl svg { flex: none; }
  .fl .fnm { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e8fdff; }
  .fl .fmt { font-size: 10px; opacity: .55; letter-spacing: 1px; text-align: right; line-height: 1.5; }

  /* ---- documento che si scrive ---- */
  .paper { padding: 26px 36px 34px; font-family: "Segoe UI", system-ui, sans-serif; font-size: 15.5px;
    line-height: 1.65; color: #d9f9ff; letter-spacing: .15px; text-shadow: none; }
  .paper .dt { font-size: 27px; color: #fff; font-weight: 600; letter-spacing: 0; margin-bottom: 18px;
    padding-bottom: 14px; border-bottom: 1px solid rgba(0,229,255,.35); text-shadow: 0 0 12px rgba(0,229,255,.5); }
  .paper h2, .paper h3, .paper h4 { color: #fff; font-weight: 600; margin: 20px 0 8px; }
  .paper h2 { font-size: 21px; } .paper h3 { font-size: 18px; color: #aef6ff; } .paper h4 { font-size: 16px; color: #aef6ff; }
  .paper p { margin: 0 0 12px; } .paper ul, .paper ol { margin: 0 0 12px 24px; } .paper li { margin-bottom: 5px; }
  .paper b { color: #fff; }
  .cur { display: inline-block; width: 9px; height: 1.05em; margin-left: 2px; vertical-align: -3px;
    background: var(--c); box-shadow: 0 0 12px var(--c); animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- stato, sottotitoli, saluto ---- */
  #greet { bottom: 95px; left: 0; right: 0; text-align: center; font-size: 22px; letter-spacing: 4px; pointer-events: none; }
  #hint { bottom: 18px; left: 76px; font-size: 11px; pointer-events: none; }
  #hint.on { opacity: .38; }
  #state { position: fixed; top: 112px; left: 0; right: 0; text-align: center; font-size: 13px; letter-spacing: 7px;
    pointer-events: none; opacity: 0; transition: opacity .6s, color .4s; z-index: 3; }
  #state.show { opacity: 1; }
  #state.listening { color: var(--g); text-shadow: 0 0 10px var(--g); }
  #state.thinking { color: var(--a); text-shadow: 0 0 10px var(--a); }
  #state.speaking, #state.writing { color: var(--c); text-shadow: 0 0 10px var(--c); }
  #caption { position: fixed; bottom: 135px; left: 50%; transform: translateX(-50%); width: min(900px, 78vw);
    text-align: center; pointer-events: none; opacity: 0; transition: opacity .6s; z-index: 3;
    text-shadow: 0 0 8px var(--c); letter-spacing: 1px; }
  #caption.show { opacity: 1; }
  #caption .u { font-size: 14px; opacity: .6; margin-bottom: 8px; }
  #caption .j { font-size: 20px; line-height: 1.45; color: #e8fdff; }

  /* ---- lettore mail ---- */
  #reader { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(2,7,13,.82); }
  #reader.open { display: flex; }
  #reader .box { width: min(860px, 88vw); max-height: 84vh; display: flex; flex-direction: column;
    border: 1px solid var(--c); background: rgba(3,16,26,.97); box-shadow: 0 0 40px rgba(0,229,255,.35); padding: 22px 26px; }
  #reader .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 8px; }
  #rsubj { font-size: 20px; letter-spacing: 1px; text-shadow: 0 0 8px var(--c); word-break: break-word; }
  #rmeta { font-size: 12px; opacity: .7; margin-bottom: 12px; letter-spacing: 1px; }
  #rwhy { font-size: 12px; border-left: 3px solid var(--c); padding: 7px 11px; margin-bottom: 14px;
    background: rgba(0,229,255,.07); letter-spacing: 1px; line-height: 1.5; }
  #rbody { flex: 1; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; font-family: inherit;
    font-size: 14px; line-height: 1.6; letter-spacing: .3px; color: #bff6ff; }
  #rclose { flex: none; border: 1px solid var(--c); background: transparent; color: var(--c); padding: 6px 14px;
    letter-spacing: 2px; cursor: pointer; }
  #rclose:hover { background: rgba(0,229,255,.18); }

  /* ---- scrivania: finestre di foto e documenti governate a voce ---- */
  #c { transition: opacity .9s; }
  body.has-desk #c { opacity: .28; }
  body.has-desk #left.on, body.has-desk #feed.on { opacity: .1; pointer-events: none; transition: opacity .6s; }
  .vw { position: fixed; z-index: 5; display: flex; flex-direction: column; overflow: hidden;
    background: linear-gradient(180deg, rgba(4,24,37,.94), rgba(3,13,22,.96));
    border: 1px solid rgba(0,229,255,.5); box-shadow: 0 0 50px rgba(0,229,255,.2), inset 0 0 40px rgba(0,229,255,.05);
    letter-spacing: 1px; animation: vwin .7s cubic-bezier(.16,.84,.24,1) both;
    transition: left .85s cubic-bezier(.16,.84,.24,1), top .85s cubic-bezier(.16,.84,.24,1),
                width .85s cubic-bezier(.16,.84,.24,1), height .85s cubic-bezier(.16,.84,.24,1), opacity .4s, border-color .4s; }
  .vw.top { border-color: #aef6ff; }
  .vw.out { opacity: 0; pointer-events: none; }
  @keyframes vwin { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
  .vw .cn { position: absolute; width: 14px; height: 14px; border: 2px solid #aef6ff; z-index: 2; pointer-events: none; }
  .vw .cn.a { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .vw .cn.b { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
  .vw .cn.c { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
  .vw .cn.d { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .vh { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 12px; letter-spacing: 3px;
    border-bottom: 1px solid rgba(0,229,255,.25); }
  .vt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
  .vtag { padding: 2px 9px; font-size: 10px; letter-spacing: 3px; border: 1px solid currentColor; display: none; }
  .vtag.show { display: block; }
  .vtag.orig { color: var(--c); } .vtag.mod { color: var(--g); }
  .vz { font-size: 11px; color: var(--a); opacity: 0; transition: opacity .4s; }
  .vz.show { opacity: 1; }
  .vx { width: 24px; height: 24px; cursor: pointer; color: var(--c); background: none; border: 1px solid rgba(0,229,255,.4); }
  .vx:hover { background: rgba(0,229,255,.2); }
  .vb { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #02070d; display: flex; align-items: center;
    justify-content: center; cursor: grab; }
  .vb.drag { cursor: grabbing; }
  .vb img { flex: none; user-select: none; -webkit-user-drag: none; transform-origin: 50% 50%;
    transition: transform .9s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 30px rgba(0,0,0,.6); }
  .vb.drag img { transition: none; }
  .vb.text { display: block; overflow-y: auto; cursor: auto; background: transparent; }
  .vb.text .paper { padding: 22px 30px 30px; }
  .vb.text::-webkit-scrollbar { width: 5px; } .vb.text::-webkit-scrollbar-thumb { background: rgba(0,229,255,.4); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scan"></div><div id="vig"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div id="title" class="panel"><h1>J.A.R.V.I.S.</h1><p>JUST A RATHER VERY INTELLIGENT SYSTEM</p></div>
<div id="clock" class="panel"><div class="t" id="time"></div><div class="d" id="date"></div></div>

<div id="left" class="panel">
  <div id="log"><div class="h"><span>// SEQUENZA DI AVVIO</span></div></div>
  <div id="dock"><div class="h"><span>// FUNZIONI</span><span class="hs">DÌ O CLICCA</span></div><div id="dlist"></div></div>
  <div id="stats"><div class="h"><span>// STATO SISTEMI</span></div></div>
</div>
<div id="feed" class="panel"><div class="h"><span>// ATTIVITÀ</span></div><div id="flist"></div></div>

<div id="desk"></div>

<div id="win">
  <i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i>
  <div class="wh"><span id="wt"></span><span class="chip" id="wchip"></span><button id="wx" title="Chiudi">✕</button></div>
  <div id="wbar"></div>
  <div id="wb"></div>
  <div id="wf"></div>
</div>

<div id="greet" class="panel"></div>
<div id="state"></div>
<div id="caption"><div class="u" id="cu"></div><div class="j" id="cj"></div></div>
<div id="hint" class="panel">ESC chiude la finestra, poi lo schermo · tasti 1-5 = funzioni</div>

<div id="reader">
  <div class="box">
    <div class="top"><div id="rsubj"></div><button id="rclose">CHIUDI</button></div>
    <div id="rmeta"></div>
    <div id="rwhy"></div>
    <pre id="rbody"></pre>
  </div>
</div>

<script>
const TOKEN = '__TOKEN__';
let USER_NAME = new URLSearchParams(location.search).get('name') || "";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';

// ---------------------------- icone ----------------------------
const ICONS = {
  mail: '<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 7l9 6 9-6"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M12 14h2M16 14h2M8 17h2M12 17h2"/>',
  weather: '<circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M2 8h1.5M3.8 3.8l1 1M12.2 3.8l-1 1"/><path d="M7 20a4 4 0 010-8 5 5 0 019.6 1.2A3.4 3.4 0 0117 20z"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  doc: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
  partly: '<circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M2 8h1.5M3.8 3.8l1 1M12.2 3.8l-1 1"/><path d="M7 20a4 4 0 010-8 5 5 0 019.6 1.2A3.4 3.4 0 0117 20z"/>',
  cloud: '<path d="M7 19a4 4 0 010-8 5 5 0 019.6 1.2A3.4 3.4 0 0117 19z"/>',
  rain: '<path d="M7 15a4 4 0 010-8 5 5 0 019.6 1.2A3.4 3.4 0 0117 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
  snow: '<path d="M7 15a4 4 0 010-8 5 5 0 019.6 1.2A3.4 3.4 0 0117 15z"/><path d="M8 19h.01M12 19h.01M16 19h.01M10 22h.01M14 22h.01" stroke-width="2.6"/>',
  storm: '<path d="M7 14a4 4 0 010-8 5 5 0 019.6 1.2A3.4 3.4 0 0117 14z"/><path d="M13 14l-3 5h3l-2 4"/>',
  fog: '<path d="M4 8h16M6 12h12M4 16h16M7 20h10"/>'
};
const svg = (name, size, sw) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw || 1.6}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
function wxName(c) {
  if (c === 0 || c === 1) return 'sun'; if (c === 2) return 'partly'; if (c === 3) return 'cloud';
  if (c === 45 || c === 48) return 'fog';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
  if (c >= 95) return 'storm'; return 'cloud';
}

// ---------------------------- canvas ----------------------------
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

const C = '0,229,255';
const start = performance.now();
let mode = 'idle';          // idle | listening | thinking | speaking | writing
let wave = 0.8, shift = 0, shiftT = 0;
const clamp = x => Math.min(Math.max(x, 0), 1);
const ease = x => 1 - Math.pow(1 - clamp(x), 3);

function ring(cx, cy, r, lw, dash, rot, a) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.setLineDash(dash); ctx.lineWidth = lw; ctx.strokeStyle = `rgba(${C},${a})`; ctx.stroke();
  ctx.restore();
}
function arcs(cx, cy, r, lw, n, span, rot, a) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.setLineDash([]); ctx.lineWidth = lw; ctx.strokeStyle = `rgba(${C},${a})`;
  for (let i = 0; i < n; i++) { const s = i * Math.PI * 2 / n; ctx.beginPath(); ctx.arc(0, 0, r, s, s + span); ctx.stroke(); }
  ctx.restore();
}
function ticks(cx, cy, r, n, rot, a) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.setLineDash([]); ctx.strokeStyle = `rgba(${C},${a})`;
  for (let i = 0; i < n; i++) {
    const s = i * Math.PI * 2 / n, big = i % 5 === 0, l = big ? 14 : 7;
    ctx.lineWidth = big ? 2 : 1; ctx.beginPath();
    ctx.moveTo(Math.cos(s) * r, Math.sin(s) * r); ctx.lineTo(Math.cos(s) * (r - l), Math.sin(s) * (r - l)); ctx.stroke();
  }
  ctx.restore();
}
function polygon(cx, cy, r, n, rot, a, lw) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.setLineDash([]);
  ctx.lineWidth = lw; ctx.strokeStyle = `rgba(${C},${a})`; ctx.beginPath();
  for (let i = 0; i <= n; i++) { const s = i * Math.PI * 2 / n; i ? ctx.lineTo(Math.cos(s) * r, Math.sin(s) * r) : ctx.moveTo(Math.cos(s) * r, Math.sin(s) * r); }
  ctx.stroke(); ctx.restore();
}
function textRing(cx, cy, r, txt, rot, a) {
  const n = Math.floor(2 * Math.PI * r / 10);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.fillStyle = `rgba(${C},${a})`; ctx.font = '10px Consolas, monospace'; ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    ctx.save(); ctx.rotate(i / n * Math.PI * 2); ctx.translate(0, -r); ctx.fillText(txt[i % txt.length], 0, 0); ctx.restore();
  }
  ctx.restore();
}

const parts = Array.from({ length: 70 }, () => ({
  x: Math.random(), y: Math.random(), vx: (Math.random() - .5) * .0004, vy: (Math.random() - .5) * .0004, s: Math.random() * 1.8 + .4
}));

function frame(now) {
  const t = (now - start) / 1000;
  ctx.clearRect(0, 0, W, H);
  const fade = ease(t / 2);
  const wt = mode === 'speaking' ? 1.7 : mode === 'writing' ? 1.5 : mode === 'listening' ? 1.1 : mode === 'thinking' ? 0.5 : 0.8;
  wave += (wt - wave) * 0.08;
  shift += (shiftT * W - shift) * 0.06;

  ctx.setLineDash([]); ctx.lineWidth = 1; ctx.strokeStyle = `rgba(${C},${0.045 * fade})`;
  const gs = 50; ctx.beginPath();
  for (let x = (t * 10) % gs; x < W; x += gs) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += gs) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.fillStyle = `rgba(${C},${0.5 * fade})`;
  for (const p of parts) { p.x = (p.x + p.vx + 1) % 1; p.y = (p.y + p.vy + 1) % 1; ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.s, 0, 7); ctx.fill(); }

  const cx = W / 2 - shift, cy = H * 0.47;
  const R = Math.min(W, H) * 0.3 * ease(t / 2.5) * (1 - 1.6 * shift / W);
  $('state').style.transform = 'translateX(' + (-shift) + 'px)';
  if (R > 2) {
    textRing(cx, cy, R * 1.22, 'J.A.R.V.I.S. // ONLINE // ', -t * 0.05, 0.3 * fade);
    ring(cx, cy, R * 1.12, 1, [2, 10], t * 0.2, 0.5 * fade);
    arcs(cx, cy, R * 1.0, 6, 3, 1.2, -t * 0.4, 0.85 * fade);
    ticks(cx, cy, R * 0.9, 120, t * 0.1, 0.6 * fade);
    ring(cx, cy, R * 0.74, 3, [30, 12], t * 0.6, 0.7 * fade);
    if (ctx.createConicGradient) {
      const g = ctx.createConicGradient(t * 1.6, cx, cy);
      g.addColorStop(0, `rgba(${C},0)`); g.addColorStop(0.8, `rgba(${C},0)`); g.addColorStop(1, `rgba(${C},${0.4 * fade})`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 0.72, 0, 7); ctx.fill();
    }
    arcs(cx, cy, R * 0.6, 4, 4, 0.9, -t * 1.0, 0.8 * fade);
    ring(cx, cy, R * 0.5, 1, [], 0, 0.5 * fade);
    polygon(cx, cy, R * 0.34, 6, t * 0.5, 0.9 * fade, 2);
    polygon(cx, cy, R * 0.22, 3, -t * 0.9, 0.9 * fade, 2);
    const sp = mode === 'speaking' ? 7 : mode === 'writing' ? 6 : mode === 'listening' ? 4 : 3;
    const am = mode === 'speaking' ? 0.16 : mode === 'writing' ? 0.14 : mode === 'listening' ? 0.1 : mode === 'thinking' ? 0.12 : 0.07;
    const p = 1 + Math.sin(t * sp) * am;
    const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.3 * p);
    g2.addColorStop(0, `rgba(255,255,255,${0.95 * fade})`); g2.addColorStop(0.35, `rgba(${C},${0.8 * fade})`); g2.addColorStop(1, `rgba(${C},0)`);
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(cx, cy, R * 0.3 * p, 0, 7); ctx.fill();
  }

  if (t > 3) {
    const n = 56, bw = 8, gap = 6, total = n * (bw + gap);
    const x0 = cx - total / 2, yb = H - 60, a = clamp((t - 3) / 1.5);
    ctx.fillStyle = `rgba(${C},${0.7 * a})`;
    for (let i = 0; i < n; i++) {
      const env = Math.sin(i / n * Math.PI);
      const h = (6 + env * 30 * wave * (0.5 + 0.5 * Math.sin(t * 5 + i * 0.6) * Math.sin(t * 2.3 + i * 0.2)));
      ctx.fillRect(x0 + i * (bw + gap), yb - h / 2, bw, h);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------- orologio, avvio, stato ----------------------------
function tick() {
  const d = new Date();
  $('time').textContent = d.toLocaleTimeString('it-IT');
  $('date').textContent = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
}
tick(); setInterval(tick, 1000);

const show = (id, ms) => setTimeout(() => $(id).classList.add('on'), ms);
show('title', 500); show('clock', 1200); show('left', 1800); show('feed', 2600); show('hint', 3000);

const lines = ['NUCLEO CENTRALE', 'MODULO VOCALE', 'COLLEGAMENTO RETE', 'ACCESSO POSTA', 'BOT TELEGRAM', 'SISTEMI DI SICUREZZA', 'INTERFACCIA UTENTE'];
const log = $('log');
lines.forEach((txt, i) => setTimeout(() => {
  const d = document.createElement('div'); d.className = 'l';
  d.appendChild(document.createTextNode(txt));
  const ok = document.createElement('span'); ok.className = 'ok'; ok.textContent = 'OK';
  d.appendChild(ok); log.appendChild(d);
}, 2400 + i * 450));
// finito l'avvio, il registro lascia il posto ai pulsanti
setTimeout(() => { log.style.opacity = 0; }, 5900);
setTimeout(() => { log.style.display = 'none'; $('dock').classList.add('show'); addFeed('Sistemi avviati'); }, 6500);

const stats = $('stats');
const names = ['ENERGIA', 'SISTEMI', 'RETE', 'SICUREZZA'];
const bars = names.map(n => {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<div class="n"><span>${n}</span><span class="v">--</span></div><div class="bar"><i></i></div>`;
  stats.appendChild(r); return r;
});
function updStats() {
  bars.forEach((r, i) => {
    let v = 72 + Math.random() * 27;
    if (names[i] === 'RETE' && !navigator.onLine) v = 0;
    r.querySelector('i').style.width = v + '%';
    r.querySelector('.v').textContent = Math.round(v) + '%';
  });
}
updStats(); setInterval(updStats, 900);

// ---------------------------- pulsanti ----------------------------
const BTNS = [
  { id: 'mail', name: 'POSTA', hint: '«mostrami la posta»', icon: 'mail' },
  { id: 'calendar', name: 'CALENDARIO', hint: '«cosa ho in agenda?»', icon: 'calendar' },
  { id: 'weather', name: 'METEO', hint: '«che tempo fa?»', icon: 'weather' },
  { id: 'news', name: 'NOTIZIE', hint: '«ultime notizie»', icon: 'globe' },
  { id: 'docs', name: 'DOCUMENTI', hint: '«scrivi un documento»', icon: 'doc' }
];
BTNS.forEach((b, i) => {
  const el = document.createElement('button');
  el.className = 'btn'; el.id = 'b-' + b.id;
  el.innerHTML = `<span class="ic">${svg(b.icon, 28)}</span><span class="t"><div class="n">${b.name}</div><div class="hh">${esc(b.hint)}</div></span><span class="badge" id="bg-${b.id}"></span><span class="k">${i + 1}</span>`;
  el.addEventListener('click', () => runAction(b.id));
  $('dlist').appendChild(el);
});
function runAction(id) {
  goFull();
  fetch('/api/action?name=' + id + '&t=' + encodeURIComponent(TOKEN), { cache: 'no-store' })
    .then(() => { setTimeout(pollChat, 150); setTimeout(pollChat, 700); })
    .catch(() => addFeed('Collegamento con Jarvis non disponibile', true));
}
const TYPE_BTN = { mail: 'mail', calendar: 'calendar', weather: 'weather', web: 'news', doc: 'docs', docs: 'docs' };
function markActive(type) {
  BTNS.forEach(b => $('b-' + b.id).classList.toggle('active', TYPE_BTN[type] === b.id));
}

// ---------------------------- attivita' ----------------------------
const feed = [];
function addFeed(text, err) {
  feed.unshift({ t: new Date(), text, err: !!err }); feed.length = Math.min(feed.length, 7); renderFeed();
}
function renderFeed() {
  $('flist').innerHTML = feed.length ? feed.map(f =>
    `<div class="f${f.err ? ' err' : ''}"><span class="tm">${f.t.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}</span><span>${esc(f.text)}</span></div>`).join('')
    : '<div class="empty">In attesa di istruzioni.</div>';
}
renderFeed();
function feedFor(p) {
  const d = p.data || {};
  if (p.type === 'calendar') addFeed('Calendario letto (' + (d.events || []).length + ' eventi)');
  else if (p.type === 'weather') addFeed('Meteo: ' + (d.city || ''));
  else if (p.type === 'web') addFeed((d.mode === 'news' ? 'Notizie: ' : d.mode === 'page' ? 'Pagina letta: ' : 'Ricerca: ') + (d.query || d.arg || ''));
  else if (p.type === 'mail') addFeed('Posta aperta');
  else if (p.type === 'docs') addFeed('Elenco documenti aperto');
}

// ---------------------------- finestra laterale ----------------------------
const win = $('win'), wb = $('wb'), wt = $('wt'), wchip = $('wchip'), wbar = $('wbar'), wf = $('wf');
const CHIPS = { working: ['ELABORO', 'amber'], writing: ['SCRIVO', 'cyan'], done: ['PRONTO', 'green'], error: ['ERRORE', 'red'] };
let chipNow = '';
function setChip(k) {
  if (k === chipNow) return; chipNow = k;
  const c = CHIPS[k] || ['', '']; wchip.textContent = c[0]; wchip.className = 'chip ' + c[1];
}
let cur = { seq: -1, type: '', status: '', key: '' };
let panelSeq = -1, firstPoll = true, lastPanel = null;

function openWindow(p) {
  stopDoc();
  cur = { seq: p.seq, type: p.type, status: '', key: '' }; chipNow = '';
  win.classList.toggle('wide', p.type === 'doc');
  win.classList.toggle('isdoc', p.type === 'doc');
  win.classList.add('open');
  shiftT = p.type === 'doc' ? 0.14 : 0.09;
  $('feed').classList.add('hide');
  markActive(p.type);
  wf.style.display = 'none';
  if (p.type === 'doc') startDoc();
  renderPanel(p);
}
function closeWindow() {
  win.classList.remove('open'); shiftT = 0; $('feed').classList.remove('hide');
  stopDoc(); cur.type = ''; markActive('');
}
function userClose() {
  closeWindow();
  fetch('/api/action?name=close&t=' + encodeURIComponent(TOKEN), { cache: 'no-store' }).catch(() => {});
}
$('wx').addEventListener('click', userClose);

function skeleton(n, msg) {
  let h = `<div class="scanmsg">${esc(msg)}</div>`;
  for (let i = 0; i < n; i++) h += '<div class="sk"></div>';
  return h;
}
const errBox = m => `<div class="errbox">${esc(m || 'Qualcosa non ha funzionato.')}</div>`;

function renderPanel(p) {
  const d = p.data || {}, st = p.status;
  if (p.type === 'doc') { updateDoc(p); return; }
  wt.textContent = '// ' + (p.type === 'mail' ? 'POSTA IMPORTANTE (' + unreadCount() + ')' : (p.title || ''));
  const key = JSON.stringify([p.type, st, d, p.type === 'mail' ? mailsKey : '']);
  if (key === cur.key) return;
  cur.key = key;
  if (st === 'done' && cur.status !== 'done') feedFor(p);
  if (st === 'error' && cur.status !== 'error') addFeed('Errore: ' + (d.error || p.title), true);
  cur.status = st;
  setChip(st); wbar.classList.toggle('run', st === 'working');
  ({ calendar: rCalendar, weather: rWeather, web: rWeb, mail: rMail, docs: rDocs }[p.type] || (() => { wb.innerHTML = ''; }))(p);
}

function fmtRange(s, e) {
  const a = new Date(s + 'T00:00'), b = new Date((e || s) + 'T00:00');
  const f = x => x.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
  return (!e || s === e) ? f(a) : f(a) + ' – ' + f(b);
}
function rCalendar(p) {
  const d = p.data, st = p.status; let h = '';
  if (d.start) h += `<div class="sub">PERIODO: ${esc(fmtRange(d.start, d.end).toUpperCase())}</div>`;
  if (st === 'working') h += skeleton(4, 'CONNESSIONE A ICLOUD...');
  else if (st === 'error') h += errBox(d.error);
  else {
    const ev = d.events || [];
    if (!ev.length) h += '<div class="empty">Nessun evento in questo periodo.</div>';
    let last = '', i = 0;
    for (const e of ev) {
      if (e.day !== last) { h += `<div class="day">${esc(e.day)}</div>`; last = e.day; }
      h += `<div class="ev" style="animation-delay:${i++ * 90}ms"><div class="tm">${esc(e.time)}</div><div><div class="ti">${esc(e.title)}</div>${e.place ? `<div class="pl">${esc(e.place)}</div>` : ''}</div></div>`;
    }
  }
  wb.innerHTML = h;
}
function rWeather(p) {
  const d = p.data, st = p.status;
  if (st === 'working') { wb.innerHTML = skeleton(3, 'LETTURA DATI METEO...'); return; }
  if (st === 'error' || !d.now) { wb.innerHTML = errBox(d.error); return; }
  const n = d.now;
  wb.innerHTML = `<div class="wnow">${svg(wxName(n.code), 84, 1.2)}<div><div class="big">${n.temp}°</div><div class="dsc">${esc(n.desc)}</div>` +
    `<div class="s2">${esc(String(d.city).toUpperCase())}<br>PERCEPITA ${n.feels}° · VENTO ${n.wind} KM/H</div></div></div>` +
    `<div class="wdays">` + (d.days || []).map((x, i) =>
      `<div class="wd" style="animation-delay:${i * 100}ms"><div class="wn">${esc(x.name)}</div>${svg(wxName(x.code), 38, 1.3)}` +
      `<div class="wtp"><b>${x.max}°</b> ${x.min}°</div><div class="wr">${x.rain}% PIOGGIA</div></div>`).join('') + `</div>`;
}
function rWeb(p) {
  const d = p.data, st = p.status, q = d.query || d.arg || '', m = d.mode || 'search';
  let h = `<div class="sub">${m === 'news' ? 'NOTIZIE' : m === 'page' ? 'PAGINA' : 'RICERCA'}: ${esc(q)}</div>`;
  if (st === 'working') h += '<div class="radar"><i></i></div>' + skeleton(2, 'SCANSIONE DELLA RETE...');
  else if (st === 'error') h += errBox(d.error);
  else {
    const items = d.items || [];
    if (!items.length) h += '<div class="empty">Nessun risultato.</div>';
    else if (m === 'page') h += `<div class="pg">${esc(items[0].snippet)}</div>`;
    else items.forEach((r, i) => {
      h += `<a class="r" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener" style="animation-delay:${i * 90}ms"><div class="rt">${esc(r.title)}</div>` +
        `<div class="rs">${esc((r.source || '').toUpperCase())}${r.date ? ' · ' + esc(r.date) : ''}</div><div class="rb">${esc(r.snippet)}</div></a>`;
    });
  }
  wb.innerHTML = h;
}
function rMail(p) {
  if (!mailsCache.length) { wb.innerHTML = '<div class="empty">Nessuna mail importante da leggere.</div>'; return; }
  wb.innerHTML = '';
  mailsCache.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'm' + (m.read ? ' read' : ''); el.style.animationDelay = (i * 70) + 'ms';
    el.innerHTML = `<div class="dot"></div><div class="tx"><div class="f1">${esc(m.from)}</div><div class="s1">${esc(m.subject)}</div>` +
      `<div class="b1">${m.read ? 'LETTA' : 'DA LEGGERE'}${m.announced === 'telegram' ? ' · GIÀ SU TELEGRAM' : ''}</div></div>`;
    el.addEventListener('click', () => openReader(m));
    wb.appendChild(el);
  });
}
function rDocs(p) {
  const d = p.data, st = p.status;
  wf.style.display = 'none';
  if (st === 'working') { wb.innerHTML = skeleton(4, 'LETTURA CARTELLA...'); return; }
  if (st === 'error') { wb.innerHTML = errBox(d.error); return; }
  const files = d.files || [];
  wf.style.display = 'flex';
  wf.innerHTML = '<span class="fn">' + files.length + ' DOCUMENTI</span><button class="fb" id="ffolder">APRI CARTELLA</button>';
  $('ffolder').onclick = () => fetch('/api/open?folder=1&t=' + encodeURIComponent(TOKEN)).catch(() => {});
  if (!files.length) { wb.innerHTML = '<div class="empty">Non ci sono ancora documenti. Prova a dire: «scrivi una lettera di...»</div>'; return; }
  wb.innerHTML = '';
  files.forEach((f, i) => {
    const el = document.createElement('div'); el.className = 'fl'; el.style.animationDelay = (i * 60) + 'ms';
    el.innerHTML = svg('doc', 24) + `<div class="fnm">${esc(f.name)}</div><div class="fmt">${esc(f.when)}<br>${f.kb} KB</div>`;
    el.addEventListener('click', () => fetch('/api/open?file=' + encodeURIComponent(f.name) + '&t=' + encodeURIComponent(TOKEN)).catch(() => {}));
    wb.appendChild(el);
  });
}

// ---------------------------- documento scritto in diretta ----------------------------
let doc = null;
function md(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let html = '', list = null;
  const close = () => { if (list) { html += '</' + list + '>'; list = null; } };
  for (const raw of text.split('\n')) {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) { close(); continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { close(); const n = m[1].length + 1; html += `<h${n}>${inline(m[2])}</h${n}>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else { close(); html += `<p>${inline(l.trim())}</p>`; }
  }
  close(); return html;
}
function withCursor(html) {
  const cur = '<span class="cur"></span>';
  const i = Math.max(html.lastIndexOf('</p>'), html.lastIndexOf('</li>'), html.lastIndexOf('</h2>'), html.lastIndexOf('</h3>'), html.lastIndexOf('</h4>'));
  return i < 0 ? html + cur : html.slice(0, i) + cur + html.slice(i);
}
function startDoc() {
  stopDoc();
  doc = { target: '', shown: 0, status: 'working', title: '', file: '', fin: false, instant: false, error: '', words: 0, timer: null };
  wb.innerHTML = '<div class="paper"><div class="dt" id="dt"></div><div id="dbody"></div></div>';
  wf.style.display = 'flex';
  wf.innerHTML = '<span class="fn" id="fn">NUOVO DOCUMENTO</span><button class="fb" id="fopen" disabled>APRI IN WORD</button><button class="fb" id="fclose">CHIUDI</button>';
  $('fclose').onclick = userClose;
  $('fopen').onclick = () => { if (doc && doc.file) fetch('/api/open?file=' + encodeURIComponent(doc.file) + '&t=' + encodeURIComponent(TOKEN)).catch(() => {}); };
  doc.timer = setInterval(typeTick, 33);
}
function stopDoc() { if (doc && doc.timer) clearInterval(doc.timer); doc = null; }
function updateDoc(p) {
  if (!doc) startDoc();
  const d = p.data || {}, prev = doc.status;
  doc.status = p.status; doc.title = d.title || d.arg || p.title || '';
  if (typeof d.text === 'string') doc.target = d.text;
  doc.file = d.file || ''; doc.instant = !!d.instant; doc.error = d.error || ''; doc.words = d.words || 0;
  if (doc.instant) doc.shown = doc.target.length;
  $('dt').textContent = doc.title;
  if (p.status === 'done' && prev !== 'done') addFeed((doc.instant ? 'Documento aperto: ' : 'Documento scritto: ') + (doc.file || doc.title));
  if (p.status === 'error' && prev !== 'error') addFeed('Errore: ' + (doc.error || 'documento'), true);
  markActive('doc');
}
function typeTick() {
  if (!doc) return;
  const len = doc.target.length;
  if (doc.status === 'error') {
    if (!doc.fin) { doc.fin = true; setChip('error'); wbar.classList.remove('run'); $('dbody').innerHTML = errBox('Non sono riuscito a scrivere il documento: ' + doc.error); }
    return;
  }
  if (doc.shown < len) {
    doc.shown = Math.min(len, doc.shown + Math.max(2, Math.ceil((len - doc.shown) * 0.07)));
    $('dbody').innerHTML = withCursor(md(doc.target.slice(0, doc.shown)));
    wb.scrollTop = wb.scrollHeight;
    const w = doc.target.slice(0, doc.shown).split(/\s+/).filter(Boolean).length;
    wt.textContent = '// SCRITTURA IN CORSO · ' + w + ' PAROLE';
    setChip('writing'); wbar.classList.add('run');
  } else if (doc.status === 'done' && !doc.fin) {
    doc.fin = true;
    $('dbody').innerHTML = md(doc.target);
    wt.textContent = '// DOCUMENTO · ' + (doc.words || doc.target.split(/\s+/).filter(Boolean).length) + ' PAROLE';
    setChip('done'); wbar.classList.remove('run');
    $('fn').textContent = doc.file || 'SALVATO'; $('fopen').disabled = !doc.file;
  } else if (!doc.fin) {
    if (!len) {
      wt.textContent = '// NUOVO DOCUMENTO'; setChip('working'); wbar.classList.add('run');
      $('dbody').innerHTML = '<p><span class="cur"></span></p>';
    } else $('dbody').innerHTML = withCursor(md(doc.target.slice(0, doc.shown)));
  }
}

// ---------------------------- posta ----------------------------
let mailsCache = [], mailsKey = '', lastJson = '';
const unreadCount = () => mailsCache.filter(m => !m.read).length;
function fmtDate(s) {
  const d = new Date(s);
  return isNaN(d) ? (s || '') : d.toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
async function pollMails() {
  try {
    const r = await fetch('/api/mails', { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    if (d.name && !USER_NAME) USER_NAME = d.name;
    const j = JSON.stringify(d.mails || []);
    if (j !== lastJson) {
      const before = unreadCount();
      lastJson = j; mailsCache = d.mails || []; mailsKey = j;
      const b = $('bg-mail'), n = unreadCount();
      b.textContent = n; b.classList.toggle('on2', n > 0);
      if (n > before && before >= 0 && feed.length) addFeed(n - before === 1 ? 'Nuova mail importante' : (n - before) + ' nuove mail importanti');
      if (cur.type === 'mail' && lastPanel) renderPanel(lastPanel);
    }
  } catch (e) { /* schermo aperto senza Jarvis: nessun badge */ }
}
pollMails(); setInterval(pollMails, 4000);

const reader = $('reader');
function closeReader() { reader.classList.remove('open'); }
$('rclose').addEventListener('click', closeReader);
reader.addEventListener('click', e => { if (e.target === reader) closeReader(); });
async function openReader(m) {
  $('rsubj').textContent = m.subject;
  $('rmeta').textContent = 'DA: ' + m.from + '   ·   ' + fmtDate(m.date);
  $('rwhy').textContent = m.why ? 'PERCHÉ È IMPORTANTE: ' + m.why : '';
  $('rwhy').style.display = m.why ? 'block' : 'none';
  $('rbody').textContent = 'Carico la mail...';
  reader.classList.add('open');
  try {
    const r = await fetch('/api/mail?id=' + encodeURIComponent(m.id), { cache: 'no-store' });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $('rsubj').textContent = d.subject;
    $('rmeta').textContent = 'DA: ' + d.from + '   ·   ' + fmtDate(d.date);
    $('rbody').textContent = d.body || '(Nessun testo leggibile: apri la mail direttamente in Gmail.)';
    lastJson = ''; pollMails();
  } catch (e) { $('rbody').textContent = 'Impossibile caricare la mail: ' + e.message; }
}

// ---------------------------- conversazione e pannelli (dati da Jarvis) ----------------------------
const LABELS = { listening: '● IN ASCOLTO', thinking: '● ELABORO', speaking: '● PARLO', writing: '● SCRIVO' };
function handlePanel(p) {
  if (!p) return;
  if (firstPoll) {                 // schermo appena aperto: ignora finestre vecchie
    firstPoll = false;
    if (p.age > 20 || !p.type) { panelSeq = p.seq; return; }
  }
  if (p.seq !== panelSeq) {
    panelSeq = p.seq;
    if (!p.type) { closeWindow(); return; }
    lastPanel = p; openWindow(p); return;
  }
  if (!p.type) return;
  lastPanel = p; renderPanel(p);
}
async function pollChat() {
  try {
    const r = await fetch('/api/chat', { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json(), p = d.panel;
    handlePanel(p);
    renderDesk(d.desk);
    let m = d.state || 'idle';
    if (p && p.type === 'doc' && p.status === 'writing') m = 'writing';
    else if (m === 'idle' && p && p.status === 'working') m = 'thinking';
    mode = m;
    const active = m !== 'idle';
    $('state').className = active ? 'show ' + m : '';
    $('state').textContent = LABELS[m] || '';
    const has = !!(d.user || d.jarvis), recent = has && (d.state !== 'idle' || d.age < 12);
    $('cu').textContent = d.user ? 'TU: ' + d.user : '';
    $('cj').textContent = d.jarvis || '';
    $('caption').classList.toggle('show', recent);
    if (recent) $('greet').classList.remove('on');
  } catch (e) { mode = 'idle'; $('state').className = ''; }
}
setInterval(pollChat, 600);


// ---------------------------- scrivania: finestre di foto e documenti ----------------------------
const deskEls = {};
let deskRev = -1, deskOrder = [];
function deskRect(pos, k) {
  const W = innerWidth, H = innerHeight, top = H * 0.13, hh = H * 0.68, off = k * 28;
  let r;
  if (pos === 'left') r = { x: W * 0.03, y: top, w: W * 0.46, h: hh };
  else if (pos === 'right') r = { x: W * 0.51, y: top, w: W * 0.46, h: hh };
  else if (pos === 'bl' || pos === 'br' || pos === 'tl' || pos === 'tr') {      // angoli: finestra piccola
    const cw = W * 0.30, ch = H * 0.38, cx = pos[1] === 'l' ? W * 0.02 : W * 0.98 - cw, cy = pos[0] === 't' ? H * 0.10 : H * 0.57;
    return { x: cx, y: cy, w: cw, h: ch };
  }
  else if (pos === 'full') r = { x: W * 0.02, y: H * 0.09, w: W * 0.96, h: H * 0.83 };
  else r = { x: W * 0.19, y: top, w: W * 0.62, h: hh };
  return { x: r.x + off, y: r.y + off, w: r.w - off, h: r.h - off };
}
function fitImg(el) {
  const img = el.querySelector('img'); if (!img || !img.naturalWidth) return;
  const b = el.querySelector('.vb'), cw = b.clientWidth, ch = b.clientHeight;
  const s = Math.min(cw / img.naturalWidth, ch / img.naturalHeight, 3);
  el._iw = img.naturalWidth * s; el._ih = img.naturalHeight * s;
  img.style.width = el._iw + 'px'; img.style.height = el._ih + 'px';
  applyView(el);
}
function applyView(el) {
  const img = el.querySelector('img'); if (!img || !el._iw) return;
  const b = el.querySelector('.vb'), cw = b.clientWidth, ch = b.clientHeight, z = el._z;
  const mx = Math.max(0, (el._iw * z - cw) / 2), my = Math.max(0, (el._ih * z - ch) / 2);
  el._tx = Math.min(Math.max(el._tx, -mx), mx); el._ty = Math.min(Math.max(el._ty, -my), my);
  img.style.transform = 'translate(' + el._tx + 'px,' + el._ty + 'px) scale(' + z + ')';
  const zl = el.querySelector('.vz'); zl.textContent = '×' + z.toFixed(1); zl.classList.toggle('show', z > 1.02);
}
function makeVw(w) {
  const el = document.createElement('div'); el.className = 'vw'; el.id = 'vw-' + w.id;
  el.innerHTML = '<i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i>' +
    '<div class="vh"><span class="vt"></span><span class="vtag"></span><span class="vz"></span><button class="vx" title="Chiudi">✕</button></div>' +
    '<div class="vb"></div>';
  const b = el.querySelector('.vb');
  el.querySelector('.vx').onclick = () => fetch('/api/desk?cmd=close&id=' + encodeURIComponent(w.id) + '&t=' + encodeURIComponent(TOKEN)).catch(() => {});
  el._z = 1; el._tx = 0; el._ty = 0; el._sv = '';
  if (w.type === 'image') {
    const img = document.createElement('img'); img.draggable = false;
    img.src = '/api/img?f=' + encodeURIComponent(w.file) + '&v=' + w.v + '&t=' + encodeURIComponent(TOKEN);
    img.onload = () => fitImg(el); b.appendChild(img);
    b.addEventListener('wheel', e => { e.preventDefault(); el._z = Math.min(8, Math.max(1, el._z * (e.deltaY < 0 ? 1.18 : 1 / 1.18))); applyView(el); }, { passive: false });
    let dr = null;
    b.addEventListener('pointerdown', e => { dr = { x: e.clientX, y: e.clientY, tx: el._tx, ty: el._ty }; b.classList.add('drag'); b.setPointerCapture(e.pointerId); });
    b.addEventListener('pointermove', e => { if (!dr) return; el._tx = dr.tx + e.clientX - dr.x; el._ty = dr.ty + e.clientY - dr.y; applyView(el); });
    const end = () => { dr = null; b.classList.remove('drag'); };
    b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);
    b.addEventListener('dblclick', () => { el._z = el._z > 1.05 ? 1 : 2.5; el._tx = el._ty = 0; applyView(el); });
  } else {
    b.classList.add('text');
    b.innerHTML = '<div class="paper"><div class="dt"></div><div class="db"></div></div>';
    b.querySelector('.dt').textContent = w.title; b.querySelector('.db').innerHTML = md(w.text || '');
  }
  $('desk').appendChild(el); return el;
}
function renderDesk(dk) {
  if (!dk || dk.rev === deskRev) return;
  deskRev = dk.rev;
  const ws = dk.windows || [], ids = new Set(ws.map(w => w.id)), cnt = {};
  for (const id of Object.keys(deskEls)) if (!ids.has(id)) {          // finestre chiuse
    const el = deskEls[id]; delete deskEls[id]; el.classList.add('out'); setTimeout(() => el.remove(), 450);
  }
  ws.forEach((w, i) => {
    let el = deskEls[w.id];
    if (!el) { el = deskEls[w.id] = makeVw(w); addFeed((w.type === 'image' ? 'Foto aperta: ' : 'Documento aperto: ') + w.title); }
    const k = cnt[w.pos] = (cnt[w.pos] === undefined ? 0 : cnt[w.pos] + 1), r = deskRect(w.pos, k);
    el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; el.style.width = r.w + 'px'; el.style.height = r.h + 'px';
    el.style.zIndex = 5 + i; el.classList.toggle('top', i === ws.length - 1);
    el.querySelector('.vt').textContent = '// ' + w.title;
    const tg = el.querySelector('.vtag'); tg.textContent = w.tag || ''; tg.className = 'vtag' + (w.tag ? ' show ' + (w.tag === 'ORIGINALE' ? 'orig' : 'mod') : '');
    const sv = [w.zoom, w.cx, w.cy].join();
    if (w.type === 'image' && sv !== el._sv) {                       // zoom ordinato a voce: porta il punto al centro
      el._sv = sv; el._z = w.zoom;
      el._tx = -(w.cx - 0.5) * (el._iw || 0) * w.zoom; el._ty = -(w.cy - 0.5) * (el._ih || 0) * w.zoom;
      applyView(el);
    }
    setTimeout(() => fitImg(el), 900);                               // dopo l'animazione ricalcola la misura
  });
  deskOrder = ws.map(w => w.id);
  document.body.classList.toggle('has-desk', ws.length > 0);
}
addEventListener('resize', () => { deskRev = -1; for (const id in deskEls) fitImg(deskEls[id]); });

// ---------------------------- saluto, mouse, tasti ----------------------------
const greet = $('greet');
setTimeout(() => {
  const h = new Date().getHours();
  const sal = h < 5 ? 'Buonanotte' : h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';
  const msg = sal + (USER_NAME ? ', ' + USER_NAME : '') + '. Tutti i sistemi sono online.';
  greet.classList.add('on'); let i = 0;
  const iv = setInterval(() => { greet.textContent = msg.slice(0, ++i) + (i < msg.length ? '_' : ''); if (i >= msg.length) clearInterval(iv); }, 55);
}, 4200);

let idleT;
function wakeCursor() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); }
addEventListener('mousemove', wakeCursor); wakeCursor();
function goFull() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); }
addEventListener('click', goFull);
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (reader.classList.contains('open')) closeReader();
    else if (win.classList.contains('open')) userClose();
    else if (deskOrder.length) fetch('/api/desk?cmd=close&id=' + encodeURIComponent(deskOrder[deskOrder.length - 1]) + '&t=' + encodeURIComponent(TOKEN)).catch(() => {});
    else window.close();
  } else {
    goFull();
    const i = parseInt(e.key, 10);
    if (i >= 1 && i <= BTNS.length && !e.ctrlKey && !e.altKey) runAction(BTNS[i - 1].id);
  }
});
</script>
